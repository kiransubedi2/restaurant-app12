{% extends "base.html" %}{% block title %}Table setup{% endblock %}{% block content %}<div class="page-title"><div><h1>Table setup</h1><p>Add tabs or hide tables that are not in use.</p></div></div><div class="panel"><form method="post" class="inline-form"><input name="name" required placeholder="e.g. Terrace 1"><button class="primary">Add table / tab</button></form><div class="responsive-table"><table><thead><tr><th>Table / tab</th><th>Status</th><th></th></tr></thead><tbody>{% for t in tables %}<tr><td>{{ t.name }}</td><td>{{ 'Active' if t.active else 'Hidden' }}</td><td><form method="post" action="{{ url_for('toggle_table',table_id=t.id) }}"><button class="secondary">{{ 'Hide' if t.active else 'Activate' }}</button></form></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
